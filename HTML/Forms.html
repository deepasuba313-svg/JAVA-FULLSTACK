<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3> Forms</h3>
    <form action="">
        <label for="">Text:         </label>
        <input readonly text = "Hello" type="text">
        <br>
        <br>
        <label for="">Email         </label>
        <input value="Deepa@gmail.com" type="email">
        <br>
        <br>
        <label for="">Password  </label>
        <input min="2" max="8" type="password">
        <br>
        <br>
        <label for="">Numbers        </label>
        <input min="0" max="10" type="number">
        <br>
        <br>
        <label for="">Telephone       </label>
        <input type="tel">
        <br>
        <br>
        <label for="">Color         </label>
        <input type="color">
        <br>
        <br>
        <label for="">Range         </label>
        <input min="20" type="range">

        <br>
        <br>
        <label for="">File         </label>
        <input type="file">

        <br>
        <br>
        <label for="">Submit button         </label>
        <input type="submit">

        <br>
        <br>
        <label for="">Reset button        </label>
        <input type="reset">

        <br>
        <br>
        <label for="">Date       </label>
        <input type="date">
        <br>
        <br>
        <label for="">Time       </label>
        <input type="time">
        <br>
        <br>
        <label for="">Date and Time        </label>
        <input type="datetime-local">
    
        <br>
        <br>

        <input name="gender" type="radio">Yes
        <input name="gender" type="radio">No

        <br>
        <br>
        <label for="">Checkbox       </label>
        <input name="gender" type="checkbox">Yes
        <input name="gender" type="checkbox">No
        
        <br><br>
        <label for="">Dropdown</label>
        <select name="" id="">
            <option value="">CSE</option>
            <option value="">EEE</option>
        </select>

        <br><br>
        <label for="">Textarea</label>
        <textarea  name="" id=""></textarea>
    </form>

</html>
