<body>
    <!-- combinators = explains the relationship between the listed selectors
     
      = descent
    > = child
    ~ = general sibling
    + = adjacent sibling
    
    -->

    <div id="container">
        <p>This is a #1</p>
        <p>This is a #2</p>
        <div>
            <p>This is a #3</p>

    </div>

    <p>This is a #4</p>

</body>
