<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Forms</title>
    <link rel="shortcut icon" href="https://static.vecteezy.com/system/resources/previews/021/272/478/original/isometric-flat-3d-illustration-concept-of-man-filling-registration-form-on-screen-free-vector.jpg" type="image/x-icon">
</head>
<body>
    <h1 align="center">Registration Form</h1>
    <form action="">
        <label for="">First Name:</label>
        <input type="text" >
        <br><br>
        <label for="">Last Name:</label>
        <input type="text">
        <br><br>
        <label for="">Email:</label>
        <input type="email">
        <br><br>
        <label for="">Password</label>
        <input type="password">
        <br><br>
        <label for="">Gender</label> <br>
        <input name="Gender" type="radio"> Male <br>
         <input name="Gender" type="radio"> Female <br>
        <input name="Gender" type="radio"> Others

        <br><br>
        <label for="">Date of Birth:</label>
        <input type="date">

        <br><br>
        <label for="">Phone Number:</label>
        <input type="tel">

        <br><br>
        <label for="">Time: </label>
        <input type="time">
        <br><br>
        <label for="">Enter the date and time of Registration:</label>
        <input type="datetime-local">
        <br><br>
        <label for="">Age:</label>
        <input type="number" min="20" max="100">

        <br><br>
        <label for="">Preference:</label> <br>
        <input type="checkbox"> Acrylic Painting <br>
        <input type="checkbox"> Oil Painting <br>
        <input type="checkbox"> Water Color Painting

        <br><br>
        <label for="">Select Occupation: </label>
        <select name="" id="">
        <option value="">--None of them selected--</option>
        <option value="">Student</option>
        <option value="">Manager</option>
        <option value="">Employee</option>
        <option value="">HR</option>
        <option value="">Others</option>
        </select>

        <br><br>
        <label for="">Bio: </label>
        <br>
        <textarea name="" id="" value="Please enter your self details"></textarea>

        <br><br>

        <input type="reset">
        <input type="submit">

        <br><br>



    </form>
</body>
</html>
